name: rm-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build llama.cpp static libs (iOS arm64 + Metal)
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-src
          cmake -S llama-src -B llama-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF -DGGML_ACCELERATE=OFF -DGGML_LLAMAFILE=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build llama-build --config Release --target llama -j$(sysctl -n hw.ncpu)
          mkdir -p llama-libs llama-include
          find llama-build -name "*.a" -exec cp {} llama-libs/ \;
          find llama-src -name "*.h" -path "*include*" -exec cp {} llama-include/ \; 2>/dev/null || true
          echo "--- libs ---";    ls -1 llama-libs
          echo "--- headers ---"; ls -1 llama-include | head -20

      - name: Build stable-diffusion.cpp static lib (iOS arm64, Metal 走 llama 那份 ggml)
        run: |
          set -e
          # 钉死 commit，防止 master API 变动把构建搞炸
          git clone https://github.com/leejet/stable-diffusion.cpp.git sd-src
          cd sd-src
          git checkout 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
          git submodule update --init --recursive --depth 1
          cd ..
          cmake -S sd-src -B sd-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DSD_BUILD_EXAMPLES=OFF -DSD_BUILD_TESTS=OFF -DSD_BUILD_SERVER=OFF \
            -DSD_METAL=ON -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF -DGGML_ACCELERATE=OFF -DGGML_LLAMAFILE=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build sd-build --config Release --target stable-diffusion -j$(sysctl -n hw.ncpu)
          mkdir -p sd-libs sd-include
          # ⚠️ 只取 libstable-diffusion.a：ggml 系列统一用 llama-libs 里那份，两份 ggml 会撞符号
          find sd-build -name "libstable-diffusion.a" -exec cp {} sd-libs/ \;
          cp sd-src/include/*.h sd-include/
          echo "--- sd libs ---";    ls -1 sd-libs
          echo "--- sd headers ---"; ls -1 sd-include

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          set -e
          xcodebuild \
            -project RyMind.xcodeproj \
            -scheme RyMind \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/RyMind.app Payload/
          zip -qry RyMind.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyMind.ipa
          path: RyMind.ipa
