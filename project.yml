name: RyMind
options:
  bundleIdPrefix: com.research
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RyMind:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RyMind
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # 缺了它 → iPad 上按 iPhone 尺寸运行、四周黑边（构建全绿但看着不对）
        UILaunchScreen: {}
        NSDocumentsFolderUsageDescription: RyMind 需要访问文档目录以存放模型、Skill 与工作空间文件。
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.research.rymind
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      ENABLE_BITCODE: NO
      # ---- llama.cpp（workflow 里 cmake 编好的 iOS 静态库 + 头文件）----
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/RyMind-Bridging-Header.h
      HEADER_SEARCH_PATHS: $(PROJECT_DIR)/llama-include
      LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/llama-libs
      OTHER_LDFLAGS: -lllama -lggml -lggml-base -lggml-cpu -lggml-metal -lc++ -framework Accelerate -framework Metal -framework MetalKit
