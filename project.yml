name: RyMind
options:
  bundleIdPrefix: com.research
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RyMind:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RyMind
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSDocumentsFolderUsageDescription: RyMind 需要访问文档目录以存放模型、Skill 与工作空间文件。
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.research.rymind
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      ENABLE_BITCODE: NO
