name: RyMind
options:
  bundleIdPrefix: com.research
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RyMind:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RyMind
        CFBundleShortVersionString: "0.4.9"
        CFBundleVersion: "14"
        # 快捷指令入口（rymind://models / rymind://chat / rymind://newchat）
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.research.rymind
            CFBundleURLSchemes:
              - rymind
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # 缺了它 → iPad 上按 iPhone 尺寸运行、四周黑边（构建全绿但看着不对）
        UILaunchScreen: {}
        NSDocumentsFolderUsageDescription: RyMind 需要访问文档目录以存放模型、Skill 与工作空间文件。
    resources:
      - path: Sources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.research.rymind
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      ENABLE_BITCODE: NO
      # ---- llama.cpp + stable-diffusion.cpp（workflow 里 cmake 编好的 iOS 静态库 + 头文件）----
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/RyMind-Bridging-Header.h
      HEADER_SEARCH_PATHS: $(PROJECT_DIR)/llama-include $(PROJECT_DIR)/sd-include
      LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/llama-libs $(PROJECT_DIR)/sd-libs
      # ggml 系列只用 llama-libs 里那份（最新），libstable-diffusion.a 挂到它上面跑
      OTHER_LDFLAGS: -lllama -lstable-diffusion -lggml -lggml-base -lggml-cpu -lggml-metal -lz -lc++ -framework Accelerate -framework Metal -framework MetalKit -framework CoreVideo -framework Foundation
